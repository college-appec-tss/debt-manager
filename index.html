<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debt Manager Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#F8FAFC;
  color:#1F2937;
}

header{
  background:#1E3A8A;
  color:white;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.container{
  max-width:1000px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  padding:25px;
  margin-bottom:30px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-bottom:20px;
  color:#1E3A8A;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#1E3A8A;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#16307a;
}

.record{
  padding:15px;
  border-left:5px solid #10B981;
  background:#f9fafb;
  margin:10px 0;
  border-radius:8px;
}

.logout{
  background:#dc2626;
  margin-top:10px;
}

.logout:hover{
  background:#b91c1c;
}
  body{
    background:aqua;
  }
</style>
</head>
<body>

<header>Debt Manager Pro</header>

<div class="container">

  <div class="card">
    <h2>Add Debt Record</h2>

    <input id="name" placeholder="Client Name">
    <input id="amount" placeholder="Amount">
    <input id="phone" placeholder="Phone Number">
    <input id="dueDate" type="date">

    <button onclick="addRecord()">Save Record</button>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h2>Saved Records</h2>
    <div id="records"></div>
  </div>

</div>

<script>
const token = localStorage.getItem("token");

if(!token){
  location.href="/login";
}

async function addRecord(){
  const data={
    name:document.getElementById("name").value,
    amount:document.getElementById("amount").value,
    phone:document.getElementById("phone").value,
    dueDate:document.getElementById("dueDate").value
  };

  await fetch("/add-record",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+token
    },
    body:JSON.stringify(data)
  });

  loadRecords();
}

async function loadRecords(){
  const res=await fetch("/records",{
    headers:{
      "Authorization":"Bearer "+token
    }
  });

  const data=await res.json();

  const box=document.getElementById("records");
  box.innerHTML="";

  data.forEach(r=>{
    box.innerHTML += `
      <div class="record">
        <b>${r.name}</b><br>
        Amount: ${r.amount}<br>
        Phone: ${r.phone}<br>
        Due: ${r.dueDate}
      </div>
    `;
  });
}

function logout(){
  localStorage.removeItem("token");
  location.href="/login";
}

loadRecords();
</script>

</body>
</html>
