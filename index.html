<!DOCTYPE html>
<html>
<head>
  <title>Shop Manager PRO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>💼 Shop Manager</h1>
  <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>

  <h3>Add Record</h3>
  <input id="name" placeholder="Customer Name">
  <input id="phone" placeholder="Phone Number">
  <input id="amount" type="number" placeholder="Amount">
  <input id="dueDate" type="date">

  <button id="saveBtn">Save Record</button>

  <h3>Summary</h3>
  <p>Today: <span id="daily">0</span></p>
  <p>Month: <span id="monthly">0</span></p>
  <p>Overdue: <span id="overdue">0</span></p>

  <h3>Records</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Due</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
